{% extends "base.html" %}
{% block contenido %}
<div class="mx-auto max-w-sm pt-8">
  <div class="text-center">
    <span class="mx-auto grid h-12 w-12 place-items-center rounded-xl bg-acento text-acento-texto">
      <svg viewBox="0 0 24 24" class="h-7 w-7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-11"/></svg>
    </span>
    <h1 class="mt-4 text-2xl font-bold">Mejora tu capacidad</h1>
    <p class="mt-1 text-sm text-texto-suave">Tu plan de estudio diario: 30 minutos, una materia, un tema.</p>
  </div>
  <form method="post" class="mt-6 space-y-4 rounded-2xl border border-borde bg-superficie p-5">
    {% csrf_token %}
    {% for e in form.non_field_errors %}<p class="rounded-lg bg-red-500/10 px-3 py-2 text-sm text-red-600">{{ e }}</p>{% endfor %}
    {% for campo in form %}
    <label class="block">
      <span class="mb-1 block text-sm font-medium">{{ campo.label }}</span>
      {{ campo }}
      {% for e in campo.errors %}<span class="mt-1 block text-xs text-red-600">{{ e }}</span>{% endfor %}
    </label>
    {% endfor %}
    <button class="w-full rounded-lg bg-acento px-4 py-2.5 font-semibold text-acento-texto">{% block boton %}{% endblock %}</button>
  </form>
  <p class="mt-4 text-center text-sm text-texto-suave">{% block enlace %}{% endblock %}</p>
</div>
{% endblock %}
