{% extends "base.html" %}
{% block titulo %}Ajustes · Mejora tu capacidad{% endblock %}
{% block contenido %}
<h1 class="text-2xl font-bold">Ajustes</h1>
<form method="post" class="mt-5 space-y-4 rounded-2xl border border-borde bg-superficie p-5">
  {% csrf_token %}
  {% for campo in form %}
  <label class="block {% if campo.widget_type == 'checkbox' %}flex items-center gap-3{% endif %}">
    {% if campo.widget_type == 'checkbox' %}{{ campo }}<span class="text-sm font-medium">{{ campo.label }}</span>
    {% else %}
    <span class="mb-1 block text-sm font-medium">{{ campo.label }}</span>
    {{ campo }}
    {% if campo.help_text %}<span class="mt-1 block text-xs text-texto-suave">{{ campo.help_text }}</span>{% endif %}
    {% endif %}
    {% for e in campo.errors %}<span class="mt-1 block text-xs text-red-600">{{ e }}</span>{% endfor %}
  </label>
  {% endfor %}
  <button class="rounded-lg bg-acento px-4 py-2 font-semibold text-acento-texto">Guardar</button>
</form>
<form method="post" action="{% url 'logout' %}" class="mt-6">
  {% csrf_token %}
  <p class="text-sm text-texto-suave">Conectado como <strong>{{ user.username }}</strong>.</p>
  <button class="mt-2 rounded-lg border border-borde px-4 py-2 text-sm">Cerrar sesión</button>
</form>
{% endblock %}
